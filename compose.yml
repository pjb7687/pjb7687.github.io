# Scheduled builder for jeongbinpark.com.
#
#   docker compose up -d              # start the scheduler (auto-rebuild every Wednesday)
#   docker compose logs -f web        # follow build logs on stdout
#   docker compose run --rm web build # one-off manual build
#
# The scheduler triggers ./build.sh at BUILD_HOUR:00 every BUILD_DOW (Mon=1..Sun=7).
# Timezone is set in the image (Asia/Seoul); override TZ to change it.
#
# The container runs as uid/gid 1000 (the image's `node` user), matching the host
# user, so the bind-mounted repo never collects root-owned files. After upgrading
# from the old root-based image, recreate the node_modules volume once — it is
# still root-owned and the unprivileged user cannot write to it:
#
#   docker compose down -v && docker compose build && docker compose up -d

services:
  web:
    build: .
    image: jeongbinpark-builder
    container_name: jeongbinpark-builder
    restart: always
    init: true
    command: ["scheduler"]
    tty: true
    environment:
      TZ: Asia/Seoul
      BUILD_DOW: "3"     # Wednesday
      BUILD_HOUR: "03"   # 03:00 local
    volumes:
      # Mount the full repo so git push works.
      - .:/app
      # Separate node_modules so container installs its own (not host's).
      - node_modules:/app/node_modules
      # SSH keys for pushing to GitHub.
      - ~/.ssh:/home/node/.ssh:ro

volumes:
  node_modules:
